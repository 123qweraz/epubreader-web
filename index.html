<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EPUB Reader</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#635b4f">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header class="toolbar">
    <input id="fileInput" type="file" accept=".epub,application/epub+zip,.txt,text/plain" hidden>
    <button id="tocBtn" class="iconBtn" title="目录" data-i18n-title="toc">☰</button>
    <button id="searchBtn" class="iconBtn" title="搜索" data-i18n-title="search"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.6" y1="15.6" x2="21" y2="21"/></svg></button>
    <div class="title" id="bookTitle">EPUB Reader</div>
    <div class="toolbarRight">
      <div id="speedCtl" class="speedCtl" hidden>
        <span data-i18n="speedSlow">慢</span>
        <input id="speedRange" type="range" min="1" max="10" step="1" aria-label="自动阅读速度" data-i18n-aria="autoReadSpeedAria">
        <span data-i18n="speedFast">快</span>
      </div>
      <button id="autoBtn" title="自动阅读" data-i18n-title="autoRead">▶</button>
      <button id="modeBtn" title="切换滚动/翻页模式" data-i18n-title="modeTip">↕</button>
      <button id="settingsBtn" title="阅读设置" data-i18n-title="settings">⚙</button>
      <button id="menuBtn" class="iconBtn" title="菜单" data-i18n-title="menu">⋯</button>
    </div>
  </header>

  <div id="fileMenu" class="fileMenu" hidden>
    <button id="menuOpen"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5C10 3.8 7 3.5 4 4v14c3-.5 6-.2 8 1.5 2-1.7 5-2 8-1.5V4c-3-.5-6-.2-8 1.5z"/><line x1="12" y1="5.5" x2="12" y2="19.5"/></svg><span data-i18n="menuOpen">打开书籍…</span></button>
    <button id="menuCloseBook" hidden data-i18n="menuCloseBook">✕　关闭书籍</button>
  </div>

  <div id="settingsPanel" class="settingsPanel" hidden>
    <div class="settingSection">Language 语言</div>
    <div class="settingRow">
      <div class="themeChips">
        <button class="themeChip langChip" data-lang="" data-i18n="langAuto">自动</button>
        <button class="themeChip langChip" data-lang="zh">中文</button>
        <button class="themeChip langChip" data-lang="en">English</button>
      </div>
    </div>
    <div class="settingSection" data-i18n="secTheme">系统主题</div>
    <div class="settingRow">
      <div class="themeChips">
        <button class="themeChip" data-theme="light" data-i18n="themeLight">浅色</button>
        <button class="themeChip" data-theme="sepia" data-i18n="themeSepia">羊皮纸</button>
        <button class="themeChip" data-theme="dark" data-i18n="themeDark">深色</button>
      </div>
    </div>
    <div class="settingSection" data-i18n="secCustom">自定义主题</div>
    <div class="settingRow">
      <div id="slotChips" class="themeChips"></div>
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="ctBgLabel">正文背景</span>
      <input id="ctBg" type="color" aria-label="自定义正文背景色" data-i18n-aria="colorAriaBg">
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="ctFgLabel">文字颜色</span>
      <input id="ctFg" type="color" aria-label="自定义文字颜色" data-i18n-aria="colorAriaFg">
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="ctUiLabel">界面底色</span>
      <input id="ctUi" type="color" aria-label="自定义界面底色" data-i18n-aria="colorAriaUi">
    </div>
    <button id="ctReset" class="settingReset" data-i18n="ctReset">重置本槽为初始配色</button>
    <div class="settingSection" data-i18n="secType">排版</div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="fontSize">字号</span>
      <input id="fontSizeRange" type="range" min="10" max="36" step="1" aria-label="字体大小" data-i18n-aria="fontSizeRangeAria">
      <button id="fsMinus" class="stepBtn" title="减小字体" data-i18n-title="fsMinusTip">A−</button>
      <button id="fsPlus" class="stepBtn" title="增大字体" data-i18n-title="fsPlusTip">A+</button>
      <input id="fontSizeNum" class="settingNum" type="number" min="10" max="36" step="1" aria-label="字体大小数值" data-i18n-aria="fontSizeNumAria">
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="lineHeight">行距</span>
      <input id="lineHeightRange" type="range" min="140" max="240" step="5" aria-label="行距" data-i18n-aria="lineHeightRangeAria">
      <button id="lhMinus" class="stepBtn" title="减小行距" data-i18n-title="lhMinusTip">−</button>
      <button id="lhPlus" class="stepBtn" title="增大行距" data-i18n-title="lhPlusTip">＋</button>
      <input id="lineHeightNum" class="settingNum" type="number" min="1.4" max="2.4" step="0.05" aria-label="行距数值" data-i18n-aria="lineHeightNumAria">
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="fontFamily">字体</span>
      <select id="fontFamilySel" aria-label="正文字体" data-i18n-aria="fontFamilyAria">
        <option value="serif" data-i18n="fontSerif">衬线（宋）</option>
        <option value="sans" data-i18n="fontSans">无衬线（黑）</option>
      </select>
    </div>
    <div class="settingRow">
      <label class="switch" title="开启后书籍自带的字体声明(含内嵌字体)优先于阅读器字体设置" data-i18n-title="bookFontTip">
        <input id="bookFontToggle" type="checkbox" aria-label="书籍字体优先" data-i18n-aria="bookFontAria">
        <span class="switchTrack"><span class="switchThumb"></span></span>
      </label>
      <span class="settingLabel" data-i18n="bookFontLabel">书籍字体优先</span>
    </div>
    <div class="settingSection" data-i18n="secWidth">正文宽度</div>
    <div class="settingRow">
      <label class="switch" title="开启后正文限制最大宽度" data-i18n-title="maxWTip">
        <input id="contentMaxToggle" type="checkbox" aria-label="限制正文宽度" data-i18n-aria="maxWAria">
        <span class="switchTrack"><span class="switchThumb"></span></span>
      </label>
      <span class="settingLabel" data-i18n="maxWLabel">限宽</span>
      <input id="contentMaxRange" type="range" min="480" max="1920" step="10" aria-label="正文最大宽度" data-i18n-aria="maxWRangeAria">
      <button id="cwMinus" class="stepBtn" title="减小宽度" data-i18n-title="cwMinusTip">−</button>
      <button id="cwPlus" class="stepBtn" title="增大宽度" data-i18n-title="cwPlusTip">＋</button>
      <input id="contentMaxNum" class="settingNum" type="number" min="480" max="1920" step="10" aria-label="正文宽度数值" data-i18n-aria="contentMaxNumAria">
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="sideColor">留白颜色</span>
      <input id="sideColorInput" type="color" value="#f5f3ee" aria-label="留白颜色" data-i18n-aria="sideColorAria">
    </div>
    <button id="sideReset" class="settingReset" data-i18n="sideReset">恢复默认</button>
  </div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebarHeader">
      <div class="sideTabs">
        <button id="tabToc" class="sideTab active" data-i18n="tabToc">目录</button>
        <button id="tabSearch" class="sideTab" data-i18n="tabSearch">搜索</button>
      </div>
      <button id="pinSidebar" title="固定侧边栏" aria-label="固定/浮动侧边栏" data-i18n-title="pinTip" data-i18n-aria="pinAria"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3.5 3.5H6.5L10 10z"/><line x1="12" y1="13.5" x2="12" y2="20"/><line x1="7" y1="20" x2="17" y2="20"/></svg></button>
    </div>
    <nav id="toc"></nav>
    <div id="searchPage" class="searchPage" hidden>
      <div class="searchHead">
        <input id="searchInput" type="search" placeholder="全书搜索…" data-i18n-ph="searchPh">
      </div>
      <div id="searchStatus" class="searchStatus"></div>
      <div id="searchResults"></div>
    </div>
  </aside>

  <main id="main" class="main">
    <section id="welcome" class="welcome">
      <h1>EPUB Reader</h1>
      <p data-i18n="welcomeP">把 EPUB / TXT 文件拖到这里，或者点击“选择文件”。</p>
      <button id="openWelcome" data-i18n="welcomeBtn">选择文件</button>
      <div id="shelf" class="shelf" hidden>
        <h2 data-i18n="shelfH">书架</h2>
        <div id="shelfList"></div>
      </div>
    </section>

    <section id="reader" class="reader" hidden>
      <div id="viewport" class="viewport">
        <iframe id="bookFrame" title="EPUB content" sandbox="allow-same-origin" data-i18n-title="frameTitle"></iframe>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <button id="sbPrev" class="statusZone left" title="上一章" data-i18n-title="sbPrevTip"><span class="zoneArrow">‹</span><span id="chapterLabel" data-i18n="noBook">未打开书籍</span></button>
    <div class="statusNav"><span id="pageInfo" hidden></span></div>
    <button id="sbNext" class="statusZone right" title="下一章" data-i18n-title="sbNextTip"><span id="progress">0 / 0</span><span class="zoneArrow">›</span></button>
  </footer>
  <div id="dropOverlay" class="dropOverlay" hidden><span data-i18n="dropOverlay">松开以打开文件</span></div>
  <script src="i18n.js"></script>
  <script src="reader.js"></script>
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js"));</script>
</body>
</html>
