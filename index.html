<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>EPUB Reader</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#635b4f">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header class="toolbar">
    <input id="fileInput" type="file" accept=".epub,application/epub+zip,.txt,text/plain" hidden>
    <button id="tocBtn" class="iconBtn" title="目录" aria-expanded="false" data-i18n-title="toc"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button id="searchBtn" class="iconBtn" title="搜索" aria-expanded="false" data-i18n-title="search"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.6" y1="15.6" x2="21" y2="21"/></svg></button>
    <div class="title" id="bookTitle">EPUB Reader</div>
    <div class="toolbarRight">
      <div id="speedCtl" class="speedCtl" hidden>
        <span data-i18n="speedSlow">慢</span>
        <input id="speedRange" type="range" min="1" max="10" step="1" aria-label="自动阅读速度" data-i18n-aria="autoReadSpeedAria">
        <span data-i18n="speedFast">快</span>
      </div>
      <button id="autoBtn" class="iconBtn" title="自动阅读" aria-pressed="false" data-i18n-title="autoRead"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></button>
      <button id="modeBtn" class="iconBtn" title="切换滚动/翻页模式" aria-pressed="false" data-i18n-title="modeTip"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>
      <button id="settingsBtn" class="iconBtn" title="阅读设置" aria-expanded="false" data-i18n-title="settings"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="14" cy="7" r="2.4"/><circle cx="9" cy="17" r="2.4"/></svg></button>
      <button id="closeBookBtn" class="iconBtn" title="关闭书籍" aria-label="关闭书籍" hidden data-i18n-title="closeBook" data-i18n-aria="closeBook"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <div id="settingsPanel" class="settingsPanel">
    <div class="setTabs" role="tablist" aria-label="设置分区">
      <button class="setTab active" role="tab" aria-selected="true" data-tab="appearance" data-i18n="tabAppearance">外观</button>
      <button class="setTab" role="tab" aria-selected="false" data-tab="layout" data-i18n="tabLayout">排版</button>
      <button class="setTab" role="tab" aria-selected="false" data-tab="backup" data-i18n="tabBackup">备份</button>
      <button class="setTab" role="tab" aria-selected="false" data-tab="advanced" data-i18n="tabAdvanced">高级</button>
      <button id="pinSettings" title="固定设置面板" aria-label="固定/浮动设置面板" aria-pressed="false" data-i18n-title="pinTip" data-i18n-aria="pinAria"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3.5 3.5H6.5L10 10z"/><line x1="12" y1="13.5" x2="12" y2="20"/><line x1="7" y1="20" x2="17" y2="20"/></svg></button>
    </div>
    <div class="setPages">
    <div class="setPage" data-page="appearance">
    <div class="settingSection">Language 语言</div>
    <div class="settingRow">
      <div class="themeChips">
        <button class="themeChip langChip" data-lang="" data-i18n="langAuto">自动</button>
        <button class="themeChip langChip" data-lang="zh">中文</button>
        <button class="themeChip langChip" data-lang="en">English</button>
      </div>
    </div>
    <div class="settingSection" data-i18n="secTheme">系统主题</div>
    <div class="settingRow">
      <div class="themeChips">
        <button class="themeChip" data-theme="light" data-i18n="themeLight">米白</button>
        <button class="themeChip" data-theme="white" data-i18n="themeWhite">纯白</button>
        <button class="themeChip" data-theme="sepia" data-i18n="themeSepia">羊皮纸</button>
        <button class="themeChip" data-theme="green" data-i18n="themeGreen">护眼绿</button>
        <button class="themeChip" data-theme="dark" data-i18n="themeDark">深色</button>
      </div>
    </div>
    <div class="settingSection" data-i18n="secCustom">自定义主题</div>
    <div class="settingRow">
      <div id="slotChips" class="themeChips"></div>
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="ctBgLabel">正文背景</span>
      <input id="ctBg" type="color" aria-label="自定义正文背景色" data-i18n-aria="colorAriaBg">
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="ctFgLabel">文字颜色</span>
      <input id="ctFg" type="color" aria-label="自定义文字颜色" data-i18n-aria="colorAriaFg">
    </div>
    <button id="advToggle" class="advToggle" aria-expanded="false"><span class="advArrow">▸</span> <span data-i18n="advMore">更多颜色</span></button>
    <div id="advBlock" class="advBlock" hidden>
      <div class="advRow">
        <span class="settingLabel" data-i18n="advUi">界面底色</span>
        <input id="advUi" type="color" aria-label="界面底色" data-i18n-aria="advUiAria">
        <button class="advAuto" data-i18n-title="advAutoTitle" title="恢复自动派生">↺</button>
      </div>
      <div class="advRow">
        <span class="settingLabel" data-i18n="advFg">界面文字</span>
        <input id="advFg" type="color" aria-label="界面文字颜色" data-i18n-aria="advFgAria">
        <button class="advAuto" data-i18n-title="advAutoTitle" title="恢复自动派生">↺</button>
      </div>
      <div class="advRow">
        <span class="settingLabel" data-i18n="advMuted">次要文字</span>
        <input id="advMuted" type="color" aria-label="次要文字颜色" data-i18n-aria="advMutedAria">
        <button class="advAuto" data-i18n-title="advAutoTitle" title="恢复自动派生">↺</button>
      </div>
      <div class="advRow">
        <span class="settingLabel" data-i18n="advBorder">边框</span>
        <input id="advBorder" type="color" aria-label="边框颜色" data-i18n-aria="advBorderAria">
        <button class="advAuto" data-i18n-title="advAutoTitle" title="恢复自动派生">↺</button>
      </div>
      <div class="advRow">
        <span class="settingLabel" data-i18n="advButton">按钮</span>
        <input id="advButton" type="color" aria-label="按钮颜色" data-i18n-aria="advButtonAria">
        <button class="advAuto" data-i18n-title="advAutoTitle" title="恢复自动派生">↺</button>
      </div>
      <div class="advRow">
        <span class="settingLabel" data-i18n="advAccent">强调色</span>
        <input id="advAccent" type="color" aria-label="强调色" data-i18n-aria="advAccentAria">
        <button class="advAuto" data-i18n-title="advAutoTitle" title="恢复自动派生">↺</button>
      </div>
    </div>
    <button id="ctReset" class="settingReset" data-i18n="ctReset">重置本槽为初始配色</button>
    </div>
    <div class="setPage" data-page="backup" hidden>
    <div class="settingSection" data-i18n="secShelf">书架</div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="shelfViewLabel">视图</span>
      <div class="themeChips" id="viewChips" role="group" aria-label="书架视图">
        <button class="themeChip viewChip" data-view="grid" data-i18n="viewGrid">网格</button>
        <button class="themeChip viewChip" data-view="list" data-i18n="viewList">列表</button>
      </div>
    </div>
    <div class="settingSection" data-i18n="secBackup">数据备份</div>
    <div class="settingRow">
      <button id="exportData" class="textBtn" data-i18n="exportData">导出阅读数据</button>
      <button id="importData" class="textBtn" data-i18n="importData">导入阅读数据</button>
    </div>
    </div>
    <div class="setPage" data-page="advanced" hidden>
    <div class="settingSection" data-i18n="secAdvanced">高级功能</div>
    <div class="settingRow">
      <label class="switch" title="为无注音的汉字外挂拼音标注；会话级开关，重启应用后需重新开启" data-i18n-title="pinyinTip">
        <input id="pinyinToggle" type="checkbox" aria-label="拼音标注" data-i18n-aria="pinyinAria">
        <span class="switchTrack"><span class="switchThumb"></span></span>
      </label>
      <span class="settingLabel" data-i18n="pinyinLabel">拼音标注</span>
    </div>
    <div class="settingHint" data-i18n="pinyinSessionTip">外挂注音不影响书籍自带注音的显示；开启状态不做持久化，每次打开应用需重新开启。</div>
    </div>
    <div class="setPage" data-page="layout" hidden>
    <div class="settingSection" data-i18n="secType">排版</div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="fontSize">字号</span>
      <input id="fontSizeRange" type="range" min="10" max="36" step="1" aria-label="字体大小" data-i18n-aria="fontSizeRangeAria">
      <button id="fsMinus" class="stepBtn" title="减小字体" data-i18n-title="fsMinusTip">A−</button>
      <button id="fsPlus" class="stepBtn" title="增大字体" data-i18n-title="fsPlusTip">A+</button>
      <input id="fontSizeNum" class="settingNum" type="number" min="10" max="36" step="1" aria-label="字体大小数值" data-i18n-aria="fontSizeNumAria">
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="lineHeight">行距</span>
      <input id="lineHeightRange" type="range" min="140" max="240" step="5" aria-label="行距" data-i18n-aria="lineHeightRangeAria">
      <button id="lhMinus" class="stepBtn" title="减小行距" data-i18n-title="lhMinusTip">−</button>
      <button id="lhPlus" class="stepBtn" title="增大行距" data-i18n-title="lhPlusTip">＋</button>
      <input id="lineHeightNum" class="settingNum" type="number" min="1.4" max="2.4" step="0.05" aria-label="行距数值" data-i18n-aria="lineHeightNumAria">
    </div>
    <div class="settingRow">
      <span class="settingLabel" data-i18n="fontFamily">字体</span>
      <select id="fontFamilySel" aria-label="正文字体" data-i18n-aria="fontFamilyAria">
        <option value="serif" data-i18n="fontSerif">衬线（宋）</option>
        <option value="sans" data-i18n="fontSans">无衬线（黑）</option>
      </select>
    </div>
    <div class="settingRow">
      <label class="switch" title="开启后书籍自带的字体声明(含内嵌字体)优先于阅读器字体设置" data-i18n-title="bookFontTip">
        <input id="bookFontToggle" type="checkbox" aria-label="书籍字体优先" data-i18n-aria="bookFontAria">
        <span class="switchTrack"><span class="switchThumb"></span></span>
      </label>
      <span class="settingLabel" data-i18n="bookFontLabel">书籍字体优先</span>
    </div>
    <div class="settingRow">
      <label class="switch" title="传统竖排(右起左行)，仅翻页模式；开启时自动切换到翻页模式" data-i18n-title="vertTip">
        <input id="verticalToggle" type="checkbox" aria-label="竖排阅读" data-i18n-aria="vertAria">
        <span class="switchTrack"><span class="switchThumb"></span></span>
      </label>
      <span class="settingLabel" data-i18n="vertLabel">竖排阅读</span>
    </div>
    <div class="settingSection" data-i18n="secWidth">正文宽度</div>
    <div class="settingRow">
      <label class="switch" title="开启后正文限制最大宽度" data-i18n-title="maxWTip">
        <input id="contentMaxToggle" type="checkbox" aria-label="限制正文宽度" data-i18n-aria="maxWAria">
        <span class="switchTrack"><span class="switchThumb"></span></span>
      </label>
      <span class="settingLabel" data-i18n="maxWLabel">限宽</span>
      <input id="contentMaxRange" type="range" min="480" max="1920" step="10" aria-label="正文最大宽度" data-i18n-aria="maxWRangeAria">
      <button id="cwMinus" class="stepBtn" title="减小宽度" data-i18n-title="cwMinusTip">−</button>
      <button id="cwPlus" class="stepBtn" title="增大宽度" data-i18n-title="cwPlusTip">＋</button>
      <input id="contentMaxNum" class="settingNum" type="number" min="480" max="1920" step="10" aria-label="正文宽度数值" data-i18n-aria="contentMaxNumAria">
    </div>
    <button id="sideReset" class="settingReset" data-i18n="sideReset">恢复默认</button>
    </div>
    </div>
    </div>
  </div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebarResize" id="sidebarResize"></div>
    <div class="sidebarHeader">
      <div class="sideTabs">
        <button id="tabToc" class="sideTab active" data-i18n="tabToc">目录</button>
        <button id="tabSearch" class="sideTab" data-i18n="tabSearch">搜索</button>
        <button id="tabMindMap" class="sideTab" data-i18n="tabMindMap">导图</button>
      </div>
      <button id="pinSidebar" title="固定侧边栏" aria-label="固定/浮动侧边栏" data-i18n-title="pinTip" data-i18n-aria="pinAria"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3.5 3.5H6.5L10 10z"/><line x1="12" y1="13.5" x2="12" y2="20"/><line x1="7" y1="20" x2="17" y2="20"/></svg></button>
    </div>
    <nav id="toc"></nav>
    <div id="searchPage" class="searchPage" hidden>
      <div class="searchHead">
        <input id="searchInput" type="search" placeholder="全书搜索…" data-i18n-ph="searchPh">
      </div>
      <div id="searchStatus" class="searchStatus" role="status"></div>
      <div id="searchResults"></div>
    </div>
    <div id="mindMapPage" class="mindMapPage" hidden>
      <div id="mindMapContent" class="mindMapContent"></div>
    </div>
  </aside>

  <main id="main" class="main">
    <section id="welcome" class="welcome">
      <h1>EPUB Reader</h1>
      <p data-i18n="welcomeP">把 EPUB / TXT 文件拖到这里，或者点击“选择文件”。</p>
      <button id="openWelcome" data-i18n="welcomeBtn">选择文件</button>
      <div id="shelf" class="shelf" hidden>
        <div class="shelfHead">
          <h2 data-i18n="shelfH">书架</h2>
          <div class="shelfHeadBtns" id="shelfIdleBtns">
            <button id="editShelfBtn" class="textBtn" data-i18n="shelfEdit">编辑</button>
          </div>
          <div class="shelfHeadBtns" id="shelfEditBtns" hidden>
            <button id="selAllBtn" class="textBtn" data-i18n="selectAll">全选</button>
            <button id="delSelBtn" class="textBtn danger" disabled data-i18n="delSelected">删除</button>
            <button id="doneEditBtn" class="textBtn" data-i18n="done">完成</button>
          </div>
        </div>
        <button id="relinkBtn" class="ghostBtn relinkBtn" hidden data-i18n="relinkBtn">恢复未关联书籍</button>
        <div id="shelfList"></div>
        <input id="backupInput" type="file" accept=".json,application/json" hidden>
      </div>
    </section>

    <section id="reader" class="reader" hidden>
      <div id="viewport" class="viewport">
        <iframe id="bookFrame" title="EPUB content" sandbox="allow-same-origin" data-i18n-title="frameTitle"></iframe>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <button id="sbPrev" class="statusZone left" title="上一章" data-i18n-title="sbPrevTip"><span class="zoneArrow"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></span><span id="chapterLabel" data-i18n="noBook">未打开书籍</span></button>
    <div class="statusNav"><span id="pageInfo" hidden></span></div>
    <button id="sbNext" class="statusZone right" title="下一章" data-i18n-title="sbNextTip"><span id="progress">0 / 0</span><span class="zoneArrow"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></span></button>
  </footer>
  <div id="dropOverlay" class="dropOverlay" hidden><span data-i18n="dropOverlay">松开以打开文件</span></div>
  <script src="i18n.js"></script>
  <script src="pinyin.js"></script>
  <script src="engine.js"></script>
  <script src="pager.js"></script>
  <script src="mindmap.js"></script>
  <script src="reader.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
      /* 版本握手: SW 换版后页面可能仍持有旧静态资源(缓存优先), 检测到版本变化自动刷新一次 */
      navigator.serviceWorker.addEventListener("message", e => {
        if (e.data?.type !== "shell-version") return;
        console.info(`[阅读器] 资源版本 ${e.data.version}`);
        try {
          const prev = localStorage.getItem("shellVer");
          localStorage.setItem("shellVer", e.data.version);
          if (prev && prev !== e.data.version) location.reload();
        } catch {}
      });
      navigator.serviceWorker.controller?.postMessage("version");
    }
  </script>
</body>
</html>
